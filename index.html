<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Josh Photography — Elegant, warm, and cinematic wedding and celebration photography. Timeless moments and authentic storytelling." />
  <title>Josh Photography | Weddings & Celebrations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Outfit:wght@200;300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="preload" as="image" href="./logo-black.png">
  <script>
    (function () {
      var repo = '/joshphotography.co.uk';
      if (window.location.pathname.startsWith(repo)) {
        var fixUrl = function (url) {
          if (typeof url === 'string' && url.startsWith('/') && !url.startsWith(repo) && !url.startsWith('//')) {
            return repo + url;
          }
          return url;
        };
        var origSetAttr = HTMLImageElement.prototype.setAttribute;
        HTMLImageElement.prototype.setAttribute = function (name, val) {
          if (name === 'src') val = fixUrl(val);
          return origSetAttr.call(this, name, val);
        };
        var desc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
        if (desc && desc.set) {
          Object.defineProperty(HTMLImageElement.prototype, 'src', {
            set: function (val) {
              desc.set.call(this, fixUrl(val));
            },
            get: desc.get
          });
        }
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
